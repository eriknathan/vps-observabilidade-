# Loki — configuração single-binary para uma única VPS.
#
# Decisões (ver README > Loki para o detalhamento):
#   - auth_enabled: false        → single tenant, Loki só é alcançável dentro
#                                    da rede Docker interna, não há por que
#                                    pagar o custo de multi-tenancy.
#   - store: tsdb / v13          → índice recomendado atual (substitui o
#                                    boltdb-shipper legado) para deployments
#                                    single-binary com storage em filesystem.
#   - object_store: filesystem   → sem dependência de S3/GCS/blob storage;
#                                    tudo fica no volume `loki_data`.
#   - compactor + retenção       → evita crescimento de disco ilimitado.
#   - limits_config               → protege a VPS de um container "barulhento"
#                                    que gere volume anormal de logs.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  # Definido via .env (LOKI_RETENTION_DAYS), expandido no boot pela flag
  # -config.expand-env=true do container.
  retention_period: ${LOKI_RETENTION_DAYS}

  # Amostras mais antigas que isso são rejeitadas — evita que um coletor
  # com clock errado ou reprocessando arquivos antigos infle a retenção.
  reject_old_samples: true
  reject_old_samples_max_age: 168h # 7 dias

  # Limites de ingestão por tenant (aqui, o único tenant "fake"): protegem a
  # VPS caso um container comece a gerar logs em volume anormal.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB

  # Teto de streams e de séries por query — mantém o consumo de memória do
  # Loki previsível numa VPS pequena, mesmo que o número de containers cresça.
  max_streams_per_user: 10000
  max_query_series: 5000

  # Habilita o endpoint de volume de logs, usado pelo painel "Log volume"
  # do dashboard Logs Overview.
  volume_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: true

analytics:
  reporting_enabled: false
