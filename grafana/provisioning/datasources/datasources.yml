# Datasources provisionados automaticamente — disponíveis assim que o
# Grafana sobe, sem passar por Connections > Data Sources na UI.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      # Prometheus não é acessado por engines de LLM/tracing aqui; caching
      # padrão do Grafana é suficiente para uma única VPS.
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Correlação: um clique num log com um trace/estrutura numérica não é
      # usado aqui (não há tracing na stack). A navegação métricas -> logs é
      # simplesmente rolar até a linha "Logs" do dashboard Observability
      # (observability.json) e filtrar por `logs_container` — como tudo vive
      # num único dashboard, não há necessidade de data links entre painéis.
    editable: false
