# Política de notificação padrão: tudo que disparar vai para o contact point
# "equipe-ops" (ver contact-points.yml). Alertas "critical" reagrupam mais
# rápido e repetem com mais frequência do que os demais.
apiVersion: 1

policies:
  - orgId: 1
    receiver: equipe-ops
    group_by: ["alertname", "host"]
    group_wait: 30s        # espera juntar alertas relacionados antes do 1º envio
    group_interval: 5m     # intervalo mínimo entre notificações do mesmo grupo
    repeat_interval: 4h    # não fica reenviando o mesmo alerta a cada minuto
    routes:
      - receiver: equipe-ops
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h
        continue: false
